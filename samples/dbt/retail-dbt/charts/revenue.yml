# A dbt Charts board on the fct_sales mart. Validate it with `dct validate`, render it with
# `dct render charts/revenue.yml --format png`, or browse it live with `dct serve`.
title: Revenue over time
source: db

variables:
  customer:
    input: select
    column: fct_sales.customer_name

queries:
  monthly_revenue: |
    SELECT order_month, SUM(revenue) AS revenue
    FROM {{ ref('fct_sales') }}
    WHERE {{ filter('customer', customer) }}
    GROUP BY 1
    ORDER BY 1
  revenue_by_customer: |
    SELECT customer_name, SUM(revenue) AS revenue
    FROM {{ ref('fct_sales') }}
    GROUP BY 1
    ORDER BY 2 DESC

charts:
  monthly:
    type: bar
    query: monthly_revenue
    x: order_month
    y: revenue
    style:
      number_format: "$,.0f"
  by_customer:
    title: Revenue by customer
    type: bar
    query: revenue_by_customer
    x: customer_name
    y: revenue
    style:
      number_format: "$,.0f"

rows:
  - monthly
  - by_customer
