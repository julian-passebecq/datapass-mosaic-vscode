# GitHub stays canonical. Run the existing build and smoke tests on the private mirror.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

default:
  tags: [local-windows, msiold]
  interruptible: true

smoke:
  timeout: 30m
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $env:Path = 'C:\Users\julia\AppData\Local\Programs\nodejs\node-v26.13.0-win-x64;' + $env:Path
      npm.cmd ci --no-audit --no-fund
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      npm.cmd run compile
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      npm.cmd test
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & 'C:\Program Files\Python314\python.exe' -m venv .venv
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & .\.venv\Scripts\python.exe -m pip install ./runtime
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & .\.venv\Scripts\python.exe scripts/runtime_smoke.py
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
