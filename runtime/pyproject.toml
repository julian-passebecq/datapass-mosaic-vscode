[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapass-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Keep the qualified EXPLAIN ANALYZE format and DuckLake/dbt compatibility.
  "duckdb==1.5.6",
  "polars>=1.17",
  "pandas>=2.2",
  "pydantic>=2.9",
  "httpx>=0.27",
  # Later 30.x releases change the SQL pool partition analysis; upgrade with its smoke tests.
  "sqlglot==30.22.0",
  "jinja2>=3.1",
  "pyyaml>=6",
  "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datapass_runtime*", "sparklab*", "airflowlab*", "factorylab*", "sqlpoollab*", "databrickslab*", "bilab*", "dbtlab*", "sqldialects*", "missionlab*", "infralab*", "lakehouselab*", "apilab*"]

[tool.setuptools.package-data]
sparklab = ["*.json", "README.md"]
airflowlab = ["README.md"]
factorylab = ["README.md"]
sqlpoollab = ["README.md"]
databrickslab = ["README.md"]
bilab = ["README.md"]
dbtlab = ["README.md"]
missionlab = ["README.md"]
infralab = ["README.md"]
lakehouselab = ["README.md"]
apilab = ["README.md"]
sqldialects = ["README.md"]
