[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapass-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "duckdb>=1.4",
  "polars>=1.17",
  "pandas>=2.2",
  "pydantic>=2.9",
  "httpx>=0.27",
  "sqlglot>=30.19,<31",
  "jinja2>=3.1",
  "pyyaml>=6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datapass_runtime*", "sparklab*", "airflowlab*", "factorylab*", "sqlpoollab*", "databrickslab*", "bilab*", "dbtlab*", "snowflakesql*", "missionlab*"]

[tool.setuptools.package-data]
sparklab = ["*.json", "README.md"]
airflowlab = ["README.md"]
factorylab = ["README.md"]
sqlpoollab = ["README.md"]
databrickslab = ["README.md"]
bilab = ["README.md"]
dbtlab = ["README.md"]
missionlab = ["README.md"]
snowflakesql = ["README.md"]
