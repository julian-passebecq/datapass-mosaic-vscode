name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

# A new push to a pull request cancels its previous run; runs on main and codex/** always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # One build: vsce package runs vscode:prepublish (npm run compile, typecheck included), then the tests.
      - run: npm run package
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: datapass-workbench-vsix
          path: "*.vsix"
          if-no-files-found: error

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: runtime/pyproject.toml
      - run: uv pip install --system ./runtime
      - run: python -m compileall -q runtime/datapass_runtime runtime/sparklab runtime/airflowlab runtime/factorylab runtime/sqlpoollab runtime/databrickslab runtime/bilab runtime/dbtlab runtime/sqldialects runtime/missionlab runtime/infralab
      - run: python scripts/authoring/gen_pylance_stubs.py --check
        env:
          PYTHONPATH: runtime
      - run: python scripts/runtime_smoke.py
      # Graded in parallel processes (DATAPASS_PACKS_JOBS, default: one per CPU, at most 8); same counts and failure list.
      - run: python scripts/exercise_packs_smoke.py
      - run: python scripts/projects_smoke.py
      # Terminal Lab missions: each reference script is played with real bash and PowerShell (pwsh is on the runner)
      # in a fixture built by the runtime, and must pass; the untouched fixtures and the mutants must fail.
      - run: DATAPASS_REQUIRE_POWERSHELL=1 python scripts/terminal_missions_smoke.py
      # Infra Lab missions: each reference is typed in the simulated shell (no real terraform, docker, kubectl or az)
      # and must pass; the untouched fixtures, the starters and the mutants must fail.
      - run: python scripts/infra_missions_smoke.py
      - run: python -m compileall -q runtime/lakehouselab && DATAPASS_REQUIRE_DUCKLAKE=1 python scripts/lakehouse_smoke.py  # Lakehouse Lab: references pass, starters and mutants fail (real DuckDB, DuckLake, Delta, Polars)
      - run: python scripts/api_lab_smoke.py

  extension-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: runtime/pyproject.toml
      - run: uv pip install --system ./runtime
      # Real dbt Core and dbt Charts for the dbt Lab steps (terminal + catalog handoff), in its own venv as the extension installs it,
      # with DuckDB pinned to the runtime's version.
      - name: dbt tools
        run: |
          uv venv --seed --quiet "$RUNNER_TEMP/dbt-tools"
          uv pip install --quiet --python "$RUNNER_TEMP/dbt-tools/bin/python" "dbt-core>=1.10,<1.13" "dbt-duckdb>=1.9,<1.12" "dbt-charts>=0.8,<0.9" "duckdb==$(python -c 'import duckdb; print(duckdb.__version__)')"
      # Missions: every reference solution is played with real dbt Core and dbt Charts and must pass the checker;
      # the untouched projects and the mutants must fail. It runs here, with the dbt tools this job installs anyway,
      # so the runtime job does not wait for it.
      - run: DATAPASS_DBT_PYTHON="$RUNNER_TEMP/dbt-tools/bin/python" python scripts/missions_smoke.py
      - run: npm ci --no-audit --no-fund
      - name: Extension Development Host E2E
        run: DATAPASS_DBT_PYTHON="$RUNNER_TEMP/dbt-tools/bin/python" xvfb-run -a npm run test:host
        env:
          DATAPASS_E2E_PYTHON: python

  # The packaged VSIX in a real VS Code window, driven by Playwright like a learner: Setup/Start runtime, Mosaic SQL,
  # a Practice Submit, a narrow-width layout check of every module tab, Stop runtime.
  vscode-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      - name: VS Code UI pass
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run test:ui
        env:
          DATAPASS_UI_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-ui-pass
          path: test-results/vscode-ui
          if-no-files-found: ignore
