name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run compile
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: datapass-workbench-vsix
          path: "*.vsix"
          if-no-files-found: error

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./runtime
      - run: python -m compileall -q runtime/datapass_runtime runtime/sparklab runtime/airflowlab runtime/factorylab runtime/sqlpoollab runtime/databrickslab runtime/bilab runtime/dbtlab runtime/snowflakesql
      - run: python scripts/runtime_smoke.py
      - run: python scripts/exercise_packs_smoke.py
      - run: python scripts/projects_smoke.py

  extension-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./runtime
      - run: npm ci --no-audit --no-fund
      - name: Extension Development Host E2E
        run: xvfb-run -a npm run test:host
        env:
          DATAPASS_E2E_PYTHON: python
