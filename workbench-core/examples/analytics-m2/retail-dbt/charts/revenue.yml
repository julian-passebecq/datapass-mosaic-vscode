# Generated by Datapass. Validate using dct validate, then render with dct.
# Browser preview is NOT the dbt Charts renderer. No query ran during export.
title: "Revenue over time"
source: db

queries:
  analysis: |
    WITH board_source AS (
      SELECT order_month, customer_name, revenue
      FROM {{ ref('fct_sales') }}
      ORDER BY order_month, customer_name
    )
    SELECT "order_month" AS dimension,
           SUM("revenue") AS metric
    FROM board_source
    GROUP BY 1
    ORDER BY 1

charts:
  analysis_chart:
    title: "Revenue over time"
    query: analysis
    type: bar
    x: dimension
    y: metric

rows:
  - analysis_chart
