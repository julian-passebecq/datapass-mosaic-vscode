# sensor-api on the cluster: two pods, so one can go away without an outage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-api
  labels:
    app.kubernetes.io/name: sensor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor-api
    spec:
      containers:
        - name: api
          image: ghcr.io/contoso/sensor-api:0.1
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
