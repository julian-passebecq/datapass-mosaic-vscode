# sensor-api on the cluster. Started by the previous intern; finish it as the ticket asks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-api
  labels:
    app.kubernetes.io/name: sensor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor-api
    spec:
      containers:
        - name: api
          image: ghcr.io/contoso/sensor-api:0.1
