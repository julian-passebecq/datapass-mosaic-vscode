services:
  dashboard:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    networks:
      - frontend
    depends_on:
      - api

  api:
    build: .
    image: ingest-api:1.1
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://ingest:ingest-dev@db:5432/ingest
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest-dev
      POSTGRES_DB: ingest
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 5s
      retries: 5

networks:
  frontend:
  backend:
    internal: true
