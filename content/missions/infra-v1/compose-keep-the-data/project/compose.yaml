services:
  dashboard:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    depends_on:
      - api

  api:
    build: .
    image: ingest-api:1.1
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://ingest:ingest-dev@db:5432/ingest
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest-dev
      POSTGRES_DB: ingest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 5s
      retries: 5
