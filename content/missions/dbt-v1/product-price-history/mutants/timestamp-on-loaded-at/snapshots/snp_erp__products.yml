snapshots:
  - name: snp_erp__products
    description: Every version of each ERP product (SCD type 2).
    relation: source('erp', 'erp_products')
    config:
      unique_key: product_id
      strategy: timestamp
      updated_at: loaded_at
      # A product the ERP stops exporting was discontinued: close its current version.
      hard_deletes: invalidate
