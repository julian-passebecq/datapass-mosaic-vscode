version: 2

# The landing tables: the ingestion replaces them with each export (they are not history tables).
sources:
  - name: shop
    schema: "{{ var('raw_schema') }}"
    config:
      loaded_at_field: loaded_at
    tables:
      - name: shop_orders
        description: Orders as the web shop and the stores export them, with the time the export landed.
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: shop_order_lines
        description: Order lines of the latest export.
  - name: erp
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: erp_products
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
      - name: erp_subcategories
      - name: erp_categories
