version: 2

sources:
  - name: shop
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: shop_orders
      - name: shop_order_lines
  - name: erp
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: erp_products
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
      - name: erp_subcategories
      - name: erp_categories
