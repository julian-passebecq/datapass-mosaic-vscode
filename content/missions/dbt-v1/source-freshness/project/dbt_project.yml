name: shop
version: '1.0.0'
config-version: 2
profile: datapass_missions

model-paths: [models]
test-paths: [tests]

vars:
  # The schema the ingestion lands the exports in.
  raw_schema: fresh_raw

models:
  shop:
    # Built into <target schema>_fresh (dbt_dev_fresh with the dbt Lab's profile).
    +schema: fresh
    staging:
      +materialized: view
    marts:
      +materialized: table
