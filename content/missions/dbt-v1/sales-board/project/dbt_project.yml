name: shop
version: '1.0.0'
config-version: 2
profile: datapass_missions

model-paths: [models]
test-paths: [tests]

vars:
  # The schema the ingestion lands the exports in.
  raw_schema: board_raw

models:
  shop:
    # Built into <target schema>_board (dbt_dev_board with the dbt Lab's profile).
    +schema: board
    staging:
      +materialized: view
    marts:
      +materialized: table
