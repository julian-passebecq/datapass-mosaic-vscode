name: shop
version: '1.0.0'
config-version: 2
profile: datapass_missions

model-paths: [models]
test-paths: [tests]

vars:
  # The schema the ingestion lands the exports in.
  raw_schema: contract_raw

models:
  shop:
    # Built into <target schema>_contract (dbt_dev_contract with the dbt Lab's profile).
    +schema: contract
    staging:
      +materialized: view
    marts:
      +materialized: table
